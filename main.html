<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="description" content="NEXUS-1 Independent AI Research Project">

<title>NEXUS-1 | AI Research</title>

<style>

:root {

  --bg: #080d18;

  --panel: #111c32;

  --blue: #399cff;

  --text: #f4f7fc;

  --muted: #9aabc2;

  --border: #263750;

}

* {

  margin: 0;

  padding: 0;

  box-sizing: border-box;

  scroll-behavior: smooth;

}

body {

  background: var(--bg);

  color: var(--text);

  font-family: Arial, sans-serif;

  line-height: 1.7;

}

a {

  color: inherit;

  text-decoration: none;

}

.container {

  width: 90%;

  max-width: 1100px;

  margin: auto;

}

header {

  position: sticky;

  top: 0;

  z-index: 100;

  background: rgba(8,13,24,.96);

  border-bottom: 1px solid var(--border);

}

.navbar {

  min-height: 75px;

  display: flex;

  justify-content: space-between;

  align-items: center;

}

.logo {

  font-size: 25px;

  font-weight: 800;

  letter-spacing: 3px;

}

.logo span {

  color: var(--blue);

}

.nav-links {

  display: flex;

  gap: 25px;

  list-style: none;

}

.nav-links a {

  color: var(--muted);

  font-size: 14px;

}

.nav-links a:hover {

  color: var(--blue);

}

.menu-button {

  display: none;

  background: transparent;

  color: white;

  border: 1px solid var(--border);

  padding: 8px 12px;

  border-radius: 7px;

  cursor: pointer;

}
